<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Custom Camera</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="photo">

<div id="app">
  <video id="viewfinder" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="touch"></div>
  <div id="focusRing"></div>
  <div id="flash"></div>

  <header id="top">
    <nav id="tabs" role="tablist" style="--i:0">
      <span id="pill"></span>
      <button role="tab" data-mode="photo">Photo</button>
      <button role="tab" data-mode="video">Video</button>
      <button role="tab" data-mode="scan">Scan</button>
      <button role="tab" data-mode="qr">QR</button>
    </nav>
    <button id="cloud" class="chip" data-state="off" aria-label="Google Drive status">
      <span class="dot"></span><span id="cloudText">Connect</span>
    </button>
  </header>

  <div id="recChip" hidden><span class="rdot"></span><span id="chipTime">00:00</span></div>
  <div id="hint"></div>

  <div id="camError" hidden>
    <div class="card">
      <h2>Camera is blocked</h2>
      <p>Allow camera access for this site in Chrome, then tap retry.</p>
      <button id="camRetry" class="primary">Retry</button>
    </div>
  </div>

  <footer id="bottom">
    <button id="thumb" aria-label="Open gallery">
      <img id="thumbImg" alt="">
      <svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
    </button>

    <div id="action">
      <div id="actPhoto" class="hintpill">
        <b>Tap</b> to focus<span class="sep"></span><b>Double-tap</b> to capture
      </div>

      <button id="recBtn" class="bigbtn" aria-label="Record video">
        <span class="rdot big"></span>
        <span id="recLabel">Start recording</span>
        <span id="recTime"></span>
      </button>

      <button id="scanBtn" class="bigbtn" aria-label="Scan document">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
        <span>Scan document</span>
      </button>

      <button id="qrPick" class="bigbtn" aria-label="Choose a QR image from gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
        <span>Read QR from a photo</span>
      </button>
      <input id="qrFile" type="file" accept="image/*" hidden>
    </div>
  </footer>
</div>

<section id="gallery" hidden>
  <header class="gh">
    <button id="galBack" class="ib" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>Gallery</h1>
    <button id="galRefresh" class="ib" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>
  <nav id="galTabs">
    <button data-sec="all" class="on">All</button>
    <button data-sec="photo">Photos</button>
    <button data-sec="video">Videos</button>
    <button data-sec="scan">Scans</button>
    <button data-sec="qr">QR</button>
  </nav>
  <div id="galBody"></div>
</section>

<section id="viewer" hidden>
  <header class="vh">
    <button id="vClose" class="ib" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vt"><div id="vTitle"></div><div id="vSub"></div></div>
    <button id="vShare" class="ib" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
    <button id="vDel" class="ib" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg></button>
  </header>
  <div id="vStage"></div>
</section>

<section id="onboard" hidden>
  <div class="sheet">
    <div class="logo"><img src="icons/icon.svg" alt=""></div>
    <h2 id="obTitle"></h2>
    <p id="obText"></p>
    <button id="obPrimary" class="primary"></button>
    <button id="obSecondary" class="ghost"></button>
  </div>
</section>

<section id="qrSheet" hidden>
  <div class="sheet">
    <div class="qlabel">QR code says</div>
    <div id="qrText"></div>
    <button id="qrCopy" class="primary">Copy</button>
    <button id="qrClose" class="ghost">Close</button>
  </div>
</section>

<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
